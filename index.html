<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cigar Box Design Simulator</title>
  <link rel="stylesheet" href="shared/style.css" />
</head>
<body>
  <main class="home">
    <h3>Cigar Box Design Simulator</h3>
    <p class="note">
      ファミマ・ローソンのシール紙（178×127mm）で、シガーボックス（きぞはこ 180×120mm / かずはこ 165×120mm）に貼るシールを作るツールです。
      デザインは箱の面と同じサイズで作り、印刷用のカット線はツールが入れます。
    </p>
    <div class="cards">
      <a class="card" href="preview/">
        <h3>仕上げ・確認</h3>
        <p class="note">
          できあがった画像や SVG を読み込んで、箱に貼った仕上がりを確認します。
          カット線入りの印刷用PNGを保存できます。
        </p>
      </a>
      <a class="card" href="draft/">
        <h3>デザイン微調整（テンプレート）</h3>
        <p class="note">このページの依頼文をコピーしてAIに渡すと、参考画像をもとにしたデザイン微調整ツールを自作できます。</p>
      </a>
    </div>
  </main>
</body>
</html>
